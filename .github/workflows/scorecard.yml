name: scorecard

on:
  branch_protection_rule:
  schedule:
    # 每周六跑一次公开评分；分钟避开整点。
    - cron: "41 6 * * 6"
  push:
    branches:
      - main
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: OSSF Scorecard 分析
    runs-on: ubuntu-latest
    permissions:
      # publish_results: true 需要 id-token 证明结果来自本仓库
      id-token: write
      contents: read
      # upload-sarif 写 code scanning 需要它（此前漏配导致
      # Resource not accessible by integration，main 上连续失败）
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: 运行 Scorecard 分析
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
          persist-credentials: false

      - name: 上传 SARIF 到 code scanning
        uses: github/codeql-action/upload-sarif@faaca9a8f6edddba5725ffe5adefdab6669a2eca # v3
        with:
          sarif_file: results.sarif
