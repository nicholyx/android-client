name: pr labeler

# pull_request_target 不 checkout PR 代码——labeler 只读改动路径清单，
# 以仓库受信任分支上的配置执行，是官方认可的安全用法。
on:
  pull_request_target:

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    name: 按改动路径打标签
    runs-on: ubuntu-latest
    steps:
      - name: Label PR
        uses: actions/labeler@8558fd74291d67161a8a78ce36a881fa63b766a9 # v5
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
