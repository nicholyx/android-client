name: 功能建议
description: 新功能或对现有功能的改进
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        提交前请先搜索 [已有 Issue](../../issues?q=is%3Aissue) 避免重复。
  - type: textarea
    id: background
    attributes:
      label: 背景
      description: 为什么需要这个功能？引用真实使用痛点，不写空话。
    validations:
      required: true
  - type: textarea
    id: expectation
    attributes:
      label: 期望
      description: 做成什么样？尽量给出可勾选的验收标准。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 有没有考虑过的其他做法？为什么没选它们？
